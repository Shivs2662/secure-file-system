<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureFS</title><link rel="stylesheet" href="css/glass.css"></head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="layout">
  <aside class="glass sidebar">
    <div class="brand"><div class="logo">🔐</div>SecureFS</div>
    <nav class="nav" id="nav">
      <a data-v="dash">📊 Dashboard</a>
      <a data-v="files">📁 My Files</a>
      <a data-v="shared">🤝 Shared with me</a>
      <div class="sep">OS Lab</div>
      <a data-v="alloc">🧱 Allocation Lab</a>
      <a data-v="sched">💿 Disk Scheduling</a>
      <div class="sep admin hidden">Admin</div>
      <a data-v="audit" class="admin hidden">📜 Audit Logs</a>
      <a data-v="users" class="admin hidden">👥 Users</a>
    </nav>
    <div class="spacer"></div>
    <button id="logout">Logout</button>
  </aside>
  <main class="main">
    <header class="glass topbar"><h1 id="title">Dashboard</h1><div class="chip" id="who"></div></header>
    <section id="view"></section>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="glass modal" id="modal"></div></div>
<div id="toasts"></div>
<script src="js/app.js"></script>
</body></html>
