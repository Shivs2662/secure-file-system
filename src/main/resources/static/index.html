<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure File Management & Storage System</title><link rel="stylesheet" href="css/glass.css"></head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="auth-wrap"><div class="glass auth-card">
  <h1>🔐 SecureFS</h1>
  <div class="muted">Secure File Management &amp; Storage System<br>DBMS + Operating Systems PBL</div>
  <div class="tabs" style="margin-top:18px"><button id="tLogin" class="on" type="button">Login</button><button id="tReg" type="button">Register</button></div>
  <form id="fLogin">
    <input id="lu" placeholder="Username" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Login</button>
  </form>
  <form id="fReg" class="hidden">
    <input id="ru" placeholder="Username (3-50: letters, digits, _ . -)" required>
    <input id="re" type="email" placeholder="Email" required>
    <input id="rp" type="password" placeholder="Password (min 8 characters)" minlength="8" required>
    <button class="primary" type="submit">Create account</button>
  </form>
  <div id="msg" class="muted" style="margin-top:12px;min-height:20px"></div>
</div></div>
<script>
const $=id=>document.getElementById(id), msg=(t,c)=>{$('msg').textContent=t;$('msg').style.color=c||'#fca5a5'};
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'Request failed');return j}
$('tLogin').onclick=()=>{$('fLogin').classList.remove('hidden');$('fReg').classList.add('hidden');$('tLogin').classList.add('on');$('tReg').classList.remove('on');msg('')};
$('tReg').onclick=()=>{$('fReg').classList.remove('hidden');$('fLogin').classList.add('hidden');$('tReg').classList.add('on');$('tLogin').classList.remove('on');msg('')};
$('fLogin').onsubmit=async e=>{e.preventDefault();try{await post('/api/auth/login',{username:$('lu').value,password:$('lp').value});location.href='app.html'}catch(x){msg(x.message)}};
$('fReg').onsubmit=async e=>{e.preventDefault();try{await post('/api/auth/register',{username:$('ru').value,email:$('re').value,password:$('rp').value});
  await post('/api/auth/login',{username:$('ru').value,password:$('rp').value});location.href='app.html'}catch(x){msg(x.message)}};
fetch('/api/users/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.href='app.html'});
</script></body></html>
