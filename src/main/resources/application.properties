spring.application.name=secure-file-system
server.port=8080

# ---- MySQL (change user/password to yours) ----
spring.datasource.url=jdbc:mysql://localhost:3306/secure_file_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=PASSWORD
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- uploads ----
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# ---- Simulated disk ----
sfs.disk.blocks=200
sfs.disk.block-size=8192
sfs.storage.dir=./storage
sfs.lock.minutes=30
sfs.upload.allowed=pdf,txt,md,docx,pptx,xlsx,png,jpg,jpeg,sql,java,csv,json,html,css,js
sfs.admin.username=admin
sfs.admin.password=Admin@123
sfs.admin.email=admin@sfs.local
